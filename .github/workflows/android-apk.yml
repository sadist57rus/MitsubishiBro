name: Build Car Brother Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Car Brother debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/core@^8.5.3 @capacitor/cli@^8.5.3 @capacitor/android@^8.5.3

      - name: Typecheck
        run: npm run lint

      - name: Audit catalog
        run: npm run audit:catalog

      - name: Build web assets
        run: npm run build

      - name: Prepare native app icon assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 public/app-icon.svg > assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Generate Android project
        run: |
          npx cap add android
          npm install --no-save --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android

      - name: Set portrait as safe first-launch default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          needle = 'android:name=".MainActivity"'
          if needle not in s:
              raise SystemExit("MainActivity declaration not found in AndroidManifest.xml")
          import re
          s = re.sub(r'\s+android:screenOrientation="[^"]+"', '', s)
          s = s.replace(needle, needle + '\n            android:screenOrientation="portrait"', 1)
          p.write_text(s)
          PY

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Brother-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car Brother build ${{ github.run_number }}
          body: |
            Автоматическая сборка Car Brother для Android.
            APK собран из коммита ${{ github.sha }}.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
