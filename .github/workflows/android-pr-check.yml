name: Android APK pull request check

on:
  push:
    branches: [fix/android-workflow-reproducible-lockfile]
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - '.github/workflows/android-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build debug APK without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK for inspection
        uses: actions/upload-artifact@v5
        with:
          name: Car-Brother-APK-debug-pr
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
