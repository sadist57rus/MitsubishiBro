name: Build and typecheck
on:
  pull_request:
  push:
    branches: [main, feature/expand-brand-model-catalog]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run audit:catalog
      - run: npm run build

      - name: Upload web build for testing
        uses: actions/upload-artifact@v4
        with:
          name: MitsubishiBro-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
