name: Build and typecheck
on:
  pull_request:
  push:
    branches: [main, feature/expand-brand-model-catalog]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Reject text utility classes below 12px
        run: if grep -R -n -E 'text-\[(8|9|10|11)px\]' src; then exit 1; fi
      - run: npm run audit:catalog
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Upload web build for testing
        uses: actions/upload-artifact@v5
        with:
          name: Car-Brother-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
