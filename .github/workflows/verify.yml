name: Build and typecheck
on:
  pull_request:
  push:
    branches: [main, feature/expand-brand-model-catalog]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Upload web build for testing
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: Car-Brother-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Playwright report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-and-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
